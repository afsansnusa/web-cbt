        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");

      function uid(prefix = "id") {

      function generateExamToken() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let out = "";
        for (let i = 0; i < 6; i++)
          out += chars.charAt(Math.floor(Math.random() * chars.length));
        return out;
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDateTime(iso) {
        if (!iso) return "-";
        const d = new Date(iso);
        return d.toLocaleString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatTimeOnly(iso) {
        if (!iso) return "-";
        return new Date(iso).toLocaleTimeString("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatCountdown(totalSec) {
        const s = Math.max(0, Math.floor(totalSec));
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        const pad = (n) => String(n).padStart(2, "0");
        return hrs > 0
          ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}`
          : `${pad(mins)}:${pad(secs)}`;
      }

      async function dbInsert(table, payload) {
        if (IS_PREVIEW) {
          const record = {
            id: uid(table.slice(0, 3)),
            created_at: new Date().toISOString(),
            ...payload,
          };
          previewStore[table].unshift(record);
          await loadAllData();
          return record;
        }
        const { data, error } = await supabase
          .from(`cbt_${table}`)
          .insert(payload)
          .select()
          .single();
        if (error) throw error;
        await loadAllData();
        return data;
      }

      async function dbUpdate(table, id, payload) {
        if (IS_PREVIEW) {
          const idx = previewStore[table].findIndex((item) => item.id === id);
          if (idx !== -1)
            previewStore[table][idx] = {
              ...previewStore[table][idx],
              ...payload,
            };
          await loadAllData();
          return;
        }
        const { error } = await supabase
          .from(`cbt_${table}`)
          .update(payload)
          .eq("id", id);
        if (error) throw error;
        await loadAllData();
      }

      async function dbDelete(table, id) {
        if (IS_PREVIEW) {
          previewStore[table] = previewStore[table].filter(
            (item) => item.id !== id,
          );
          await loadAllData();
          return;
        }
        const { error } = await supabase
          .from(`cbt_${table}`)
          .delete()
          .eq("id", id);
        if (error) throw error;
        await loadAllData();
      }

      // =========================================================================
      // 7. EKSTRAKSI PDF SOAL & JAWABAN OTOMATIS KE FOLDER SOAL
      // =========================================================================
      function parseQuestionsFromText(rawText) {
        const normalized = rawText
          .replace(/\r\n/g, "\n")
          .replace(/\s+([A-E][\.\)])\s+/g, "\n$1 ")
          .replace(/\s+(Kunci\s*:|Jawaban\s*:)/gi, "\n$1");

        const blocks = normalized
          .split(/(?=\n?\d+[\.\)]\s+)/g)
          .map((b) => b.trim())
          .filter(Boolean);
        const parsed = [];

        blocks.forEach((block) => {
          const qMatch = block.match(
            /^\d+[\.\)]\s+([\s\S]*?)(?=\n[A-E][\.\)]\s+)/,
          );
          if (!qMatch) return;

          const questionText = qMatch[1].replace(/\n+/g, " ").trim();
          const optionRegex =
            /\n([A-E])[\.\)]\s+([\s\S]*?)(?=\n[A-E][\.\)]\s+|\n(?:Kunci|Jawaban)\s*:|$)/gi;
          const options = [];
          let optMatch;
          while ((optMatch = optionRegex.exec(block)) !== null) {
            options.push({
              key: optMatch[1].toUpperCase(),
              text: optMatch[2].replace(/\n+/g, " ").trim(),
            });
          }

          const keyMatch = block.match(/(?:Kunci|Jawaban)\s*:\s*([A-E])/i);
          const correctAnswer = keyMatch
            ? keyMatch[1].toUpperCase()
            : options[0]?.key || "A";

          if (questionText && options.length >= 2) {
            parsed.push({
              question_text: questionText,
              options,
              correct_answer: correctAnswer,
            });
          }
        });

        return parsed;
      }

      window.handlePdfFileUpload = async (inputEl) => {
        const file = inputEl.files?.[0];
        if (!file) return;
        if (!window.pdfjsLib) {
          showToast(
            "Pustaka pembaca PDF belum siap. Periksa koneksi internet.",
            "danger",
          );
          return;
        }

        try {
          showToast(
            "Mengekstrak teks soal & kunci jawaban dari PDF...",
            "info",
          );
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer })
            .promise;
          let fullText = "";

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const content = await page.getTextContent();
            const pageText = content.items.map((item) => item.str).join(" ");
            fullText += "\n" + pageText;
          }

          const extracted = parseQuestionsFromText(fullText);
          if (extracted.length === 0) {
            showToast(
              "Format soal tidak terdeteksi di PDF. Pastikan format nomor (1. ... A. ... B. ... Kunci: A).",
              "warning",
            );
            return;
          }

          const cleanFolderName = file.name
            .replace(/\.pdf$/i, "")
            .replace(/[_-]+/g, " ");
          state.pdfImportPreview = {
            fileName: file.name,
            defaultFolderName: cleanFolderName,
            items: extracted,
          };
          renderApp();
          showToast(
            `Berhasil membaca ${extracted.length} soal dari PDF! Siap digenerate menjadi 1 folder soal.`,
            "success",
          );
        } catch (err) {
          showToast("Gagal membaca file PDF: " + err.message, "danger");
        }
      };

      // =========================================================================
      // 8. MESIN ANTI-CURANG (SAFE EXAM BROWSER INSPIRED)
      // =========================================================================
      let antiCheatHandlers = null;

      async function logCheatingViolation(type, severity, points, description) {
        const { session, exam } = state.activeExam;
        if (!session || session.status !== "In Progress") return;

        const newScore = (session.violation_score || 0) + points;
        session.violation_score = newScore;
        state.activeExam.violationCount += 1;

        const count = state.activeExam.violationCount;
        let warningText =
          "Perhatian! Aktivitas Anda terdeteksi meninggalkan halaman ujian. Tetap fokus pada halaman ujian.";
        if (count === 2) {
          warningText =
            "Anda telah melakukan beberapa aktivitas yang tidak sesuai dengan peraturan ujian. Aktivitas ini tercatat dalam sistem.";
        } else if (count >= 3) {
          warningText =
            "Jumlah aktivitas mencurigakan Anda meningkat. Admin dapat melakukan pemeriksaan terhadap sesi ujian Anda.";
        }

        state.activeExam.warningModal = {
          count,
          type,
          description,
          message: warningText,
          totalPoints: newScore,
        };

        try {
          await dbInsert("exam_violations", {
            session_id: session.id,
            student_id: state.user.id,
            exam_id: exam.id,
            violation_type: type,
            severity,
            points,
            description,
          });
          await dbUpdate("exam_sessions", session.id, {
            violation_score: newScore,
          });
        } catch (err) {
          console.error("Violation log sync failed:", err);
        }

        renderApp();
      }

      function attachAntiCheatingListeners() {
        detachAntiCheatingListeners();

        const onVisibilityChange = () => {
          if (
            document.hidden &&
            state.activeExam.session?.status === "In Progress"
          ) {
            logCheatingViolation(
              "TAB_SWITCH",
              "High",
              3,
              "Peserta berpindah tab atau meminimalkan jendela browser.",
            );
          }
        };

        const onWindowBlur = () => {
          if (state.activeExam.session?.status === "In Progress") {
            logCheatingViolation(
              "WINDOW_BLUR",
              "Medium",
              2,
              "Jendela ujian kehilangan fokus (membuka aplikasi/popup lain).",
            );
          }
        };

        const onFullscreenChange = () => {
          if (
            !document.fullscreenElement &&
            state.activeExam.session?.status === "In Progress"
          ) {
            logCheatingViolation(
              "EXIT_FULLSCREEN",
              "High",
              2,
              "Peserta keluar dari mode layar penuh (Fullscreen).",
            );
          }
        };

        const onContextMenu = (e) => {
          if (state.activeExam.session?.status === "In Progress") {
            e.preventDefault();
            logCheatingViolation(
              "RIGHT_CLICK",
              "Low",
              1,
              "Percobaan membuka menu klik kanan di halaman ujian.",
            );
          }
        };

        const onClipboard = (e) => {
          if (state.activeExam.session?.status === "In Progress") {
            e.preventDefault();
            const typeMap = {
              copy: "COPY_ATTEMPT",
              cut: "CUT_ATTEMPT",
              paste: "PASTE_ATTEMPT",
            };
            logCheatingViolation(
              typeMap[e.type] || "COPY_ATTEMPT",
              "Medium",
              2,
              `Percobaan aksi ${e.type.toUpperCase()} teks soal/jawaban.`,
            );
          }
        };

        const onKeyDown = (e) => {
          if (state.activeExam.session?.status !== "In Progress") return;
          const key = e.key.toLowerCase();
          const isCtrl = e.ctrlKey || e.metaKey;
          if (
            e.key === "F12" ||
            e.key === "PrintScreen" ||
            (isCtrl && ["c", "v", "x", "u", "p", "s", "a"].includes(key)) ||
            (isCtrl && e.shiftKey && ["i", "j", "c"].includes(key))
          ) {
            e.preventDefault();
            logCheatingViolation(
              "SHORTCUT_ATTEMPT",
              "Medium",
              2,
              `Menekan kombinasi tombol terlarang (${e.key}).`,
            );
          }
        };

        const onBeforeUnload = (e) => {
          if (state.activeExam.session?.status === "In Progress") {
            e.preventDefault();
            e.returnValue =
              "Ujian sedang berlangsung. Meninggalkan halaman akan dicatat sebagai pelanggaran.";
          }
        };

        document.addEventListener("visibilitychange", onVisibilityChange);
        window.addEventListener("blur", onWindowBlur);
        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("contextmenu", onContextMenu);
        document.addEventListener("copy", onClipboard);
        document.addEventListener("cut", onClipboard);
        document.addEventListener("paste", onClipboard);
        document.addEventListener("keydown", onKeyDown);
        window.addEventListener("beforeunload", onBeforeUnload);

        antiCheatHandlers = {
          onVisibilityChange,
          onWindowBlur,
          onFullscreenChange,
          onContextMenu,
          onClipboard,
          onKeyDown,
          onBeforeUnload,
        };
      }

      function detachAntiCheatingListeners() {
        if (!antiCheatHandlers) return;
        document.removeEventListener(
          "visibilitychange",
          antiCheatHandlers.onVisibilityChange,
        );
        window.removeEventListener("blur", antiCheatHandlers.onWindowBlur);
        document.removeEventListener(
          "fullscreenchange",
          antiCheatHandlers.onFullscreenChange,
        );
        document.removeEventListener(
          "contextmenu",
          antiCheatHandlers.onContextMenu,
        );
        document.removeEventListener("copy", antiCheatHandlers.onClipboard);
        document.removeEventListener("cut", antiCheatHandlers.onClipboard);
        document.removeEventListener("paste", antiCheatHandlers.onClipboard);
        document.removeEventListener("keydown", antiCheatHandlers.onKeyDown);
        window.removeEventListener(
          "beforeunload",
          antiCheatHandlers.onBeforeUnload,
        );
        antiCheatHandlers = null;
      }

      // =========================================================================
      // 9. ALUR UJIAN SISWA (PRE-FLIGHT TOKEN CHECK, WORKSPACE, AUTO-SAVE & GRADING)
      // =========================================================================
      function openExamPreflight(examId) {
        const exam = state.exams.find((e) => e.id === examId);
        if (!exam) return;

        const existingSession = state.exam_sessions.find(
          (s) => s.exam_id === exam.id && s.student_id === state.user.id,
        );
        if (existingSession && existingSession.status !== "In Progress") {
          showToast("Anda sudah menyelesaikan ujian ini.", "info");
          return;
        }

        state.preflight = {
          exam,
          browserOk: false,
          networkOk: navigator.onLine,
          fullscreenOk: Boolean(document.fullscreenElement),
          rulesAccepted: false,
          tokenInput: "",
          tokenValid: false,
        };
        renderApp();
      }

      window.verifyExamTokenInput = (val) => {
        const normalized = (val || "")
          .toUpperCase()
          .replace(/\s/g, "")
          .slice(0, 10);
        state.preflight.tokenInput = normalized;
        const expected = (state.preflight.exam?.exam_token || "")
          .toUpperCase()
          .trim();
        state.preflight.tokenValid =
          expected !== "" && state.preflight.tokenInput === expected;

        const input = document.querySelector("[data-exam-token-input]");
        if (input) {
          input.value = normalized;
          const caret = normalized.length;
          input.setSelectionRange(caret, caret);
          input.classList.toggle("border-emerald-500", state.preflight.tokenValid);
          input.classList.toggle("text-emerald-700", state.preflight.tokenValid);
          input.classList.toggle("border-slate-300", !state.preflight.tokenValid);
          input.classList.toggle("text-slate-900", !state.preflight.tokenValid);
        }

        const status = document.querySelector("[data-token-status]");
        if (status) {
          status.textContent = state.preflight.tokenValid
            ? "TOKEN VALID"
            : "BELUM VALID";
          status.className =
            "px-3.5 py-2.5 rounded-xl text-xs font-bold " +
            (state.preflight.tokenValid
              ? "bg-emerald-600 text-white"
              : "bg-slate-200 text-slate-600");
        }
      };

      async function runDeviceDiagnostic() {
        state.preflight.browserOk =
          typeof document.hidden !== "undefined" &&
          typeof localStorage !== "undefined";
        state.preflight.networkOk = navigator.onLine;
        try {
          if ("wakeLock" in navigator) {
            await navigator.wakeLock.request("screen");
          }
        } catch (err) {
          // Wake Lock is optional on browsers that do not expose the API.
        }
        try {
          if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
          ) {
            await document.documentElement.requestFullscreen();
          }
          state.preflight.fullscreenOk = Boolean(document.fullscreenElement);
        } catch (err) {
          state.preflight.fullscreenOk = false;
          showToast(
            "Izin Fullscreen ditolak browser. Klik tombol sekali lagi untuk mengaktifkan layar penuh.",
            "warning",
          );
        }
        renderApp();
      }

      async function startExamSession() {
        const {
          exam,
          browserOk,
          networkOk,
          fullscreenOk,
          rulesAccepted,
          tokenValid,
        } = state.preflight;
        if (
          !exam ||
          !browserOk ||
          !networkOk ||
          !fullscreenOk ||
          !rulesAccepted ||
          !tokenValid
        ) {
          showToast(
            "Pastikan seluruh pemeriksaan perangkat berhasil, token valid, dan tata tertib disetujui.",
            "warning",
          );
          return;
        }

        try {
          let session = state.exam_sessions.find(
            (s) => s.exam_id === exam.id && s.student_id === state.user.id,
          );

          if (!session) {
            session = await dbInsert("exam_sessions", {
              exam_id: exam.id,
              student_id: state.user.id,
              session_token: uid("ses-tok"),
              status: "In Progress",
              started_at: new Date().toISOString(),
              submitted_at: null,
              violation_score: 0,
              total_score: 0,
              is_passed: false,
            });
          }

          let linkedQuestions = [];
          if (exam.folder_id) {
            linkedQuestions = state.questions.filter(
              (q) => q.folder_id === exam.folder_id,
            );
          }
          if (linkedQuestions.length === 0) {
            const linkedEq = state.exam_questions
              .filter((eq) => eq.exam_id === exam.id)
              .sort((a, b) => a.order_num - b.order_num);
            linkedQuestions = linkedEq
              .map((eq) => state.questions.find((q) => q.id === eq.question_id))
              .filter(Boolean);
          }

          if (linkedQuestions.length === 0) {
            showToast(
              "Paket ujian ini belum memiliki folder soal atau butir soal aktif.",
              "danger",
            );
            return;
          }

          const preparedQuestions = linkedQuestions.map((q) => {
            let opts = Array.isArray(q.options) ? [...q.options] : [];
            if (q.question_type === "true_false" && opts.length === 0) {
              opts = [
                { key: "Benar", text: "Benar" },
                { key: "Salah", text: "Salah" },
              ];
            }
            if (exam.shuffle_options && opts.length > 1) {
              opts.sort(() => Math.random() - 0.5);
            }
            return { ...q, displayOptions: opts };
          });

          if (exam.shuffle_questions) {
            preparedQuestions.sort(() => Math.random() - 0.5);
          }

          const existingAnswers = state.student_answers.filter(
            (a) => a.session_id === session.id,
          );
          const answersMap = {};
          existingAnswers.forEach((a) => {
            answersMap[a.question_id] = {
              selected_answer: a.selected_answer,
              is_doubtful: a.is_doubtful,
            };
          });

          const elapsedSec = Math.floor(
            (Date.now() - new Date(session.started_at).getTime()) / 1000,
          );
          const totalDurationSec = (exam.duration_minutes || 60) * 60;
          const remainingSeconds = Math.max(0, totalDurationSec - elapsedSec);

          state.preflight.exam = null;
          state.activeExam = {
            session,
            exam,
            questions: preparedQuestions,
            answersMap,
            currentIndex: 0,
            remainingSeconds,
            timerInterval: null,
            savingStatus: "Tersimpan",
            warningModal: null,
            violationCount: state.exam_violations.filter(
              (v) => v.session_id === session.id,
            ).length,
          };

          attachAntiCheatingListeners();
          startExamCountdown();
          renderApp();
        } catch (err) {
          showToast("Gagal memulai sesi ujian: " + err.message, "danger");
        }
      }

      function startExamCountdown() {
        if (state.activeExam.timerInterval)
          clearInterval(state.activeExam.timerInterval);
        state.activeExam.timerInterval = setInterval(() => {
          if (
            !state.activeExam.session ||
            state.activeExam.session.status !== "In Progress"
          ) {
            clearInterval(state.activeExam.timerInterval);
            return;
          }
          state.activeExam.remainingSeconds -= 1;
          const timerEl = document.getElementById("exam-timer-display");
          if (timerEl) {
            timerEl.textContent = formatCountdown(
              state.activeExam.remainingSeconds,
            );
            if (state.activeExam.remainingSeconds <= 300) {
              timerEl.classList.add("text-red-600", "animate-pulse");
            }
          }
          if (state.activeExam.remainingSeconds <= 0) {
            clearInterval(state.activeExam.timerInterval);
            submitExamSession(true);
          }
        }, 1000);
      }

      async function saveStudentAnswer(
        questionId,
        selectedAnswer,
        toggleDoubtful = false,
      ) {
        const { session } = state.activeExam;
        if (!session || session.status !== "In Progress") return;

        const current = state.activeExam.answersMap[questionId] || {
          selected_answer: null,
          is_doubtful: false,
        };
        const updated = {
          selected_answer:
            selectedAnswer !== undefined
              ? selectedAnswer
              : current.selected_answer,
          is_doubtful: toggleDoubtful
            ? !current.is_doubtful
            : current.is_doubtful,
        };

        state.activeExam.answersMap[questionId] = updated;
        state.activeExam.savingStatus = "Menyimpan...";
        renderApp();

        try {
          if (IS_PREVIEW) {
            const existingIdx = previewStore.student_answers.findIndex(
              (a) =>
                a.session_id === session.id && a.question_id === questionId,
            );
            const payload = {
              session_id: session.id,
              question_id: questionId,
              selected_answer: updated.selected_answer,
              is_doubtful: updated.is_doubtful,
              updated_at: new Date().toISOString(),
            };
            if (existingIdx !== -1) {
              previewStore.student_answers[existingIdx] = {
                ...previewStore.student_answers[existingIdx],
                ...payload,
              };
            } else {
              previewStore.student_answers.push({ id: uid("ans"), ...payload });
            }
            await loadAllData();
          } else {
            const { error } = await supabase.from("cbt_student_answers").upsert(
              {
                session_id: session.id,
                question_id: questionId,
                selected_answer: updated.selected_answer,
                is_doubtful: updated.is_doubtful,
                updated_at: new Date().toISOString(),
              },
              { onConflict: "session_id,question_id" },
            );
            if (error) throw error;
          }
          state.activeExam.savingStatus = "Tersimpan";
        } catch (err) {
          state.activeExam.savingStatus = "Gagal sinkron";
          showToast("Gagal menyimpan jawaban ke server.", "danger");
        }
        renderApp();
      }

      async function submitExamSession(isAutoSubmit = false) {
        const { session, exam, questions, answersMap } = state.activeExam;
        if (!session) return;

        if (state.activeExam.timerInterval)
          clearInterval(state.activeExam.timerInterval);
        detachAntiCheatingListeners();

        try {
          let totalScore = 0;
          for (const q of questions) {
            const ansObj = answersMap[q.id];
            const userAns = ansObj?.selected_answer || "";
            let isCorrect = false;
            let earned = 0;

            if (q.question_type !== "essay" && userAns && q.correct_answer) {
              isCorrect =
                userAns.trim().toLowerCase() ===
                q.correct_answer.trim().toLowerCase();
              earned = isCorrect ? Number(q.points) || 0 : 0;
            }
            totalScore += earned;

            if (IS_PREVIEW) {
              const idx = previewStore.student_answers.findIndex(
                (a) => a.session_id === session.id && a.question_id === q.id,
              );
              if (idx !== -1) {
                previewStore.student_answers[idx].is_correct = isCorrect;
                previewStore.student_answers[idx].score_earned = earned;
              }
            } else {
              await supabase
                .from("cbt_student_answers")
                .update({ is_correct: isCorrect, score_earned: earned })
                .eq("session_id", session.id)
                .eq("question_id", q.id);
            }
          }

          const isPassed = totalScore >= (exam.passing_score || 75);
          await dbUpdate("exam_sessions", session.id, {
            status: isAutoSubmit ? "Force Submitted" : "Submitted",
            submitted_at: new Date().toISOString(),
            total_score: totalScore,
            is_passed: isPassed,
          });

          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }

          state.activeExam.session = null;
          state.activeExam.warningModal = null;
          await loadAllData();
          showToast(
            isAutoSubmit
              ? "Waktu ujian habis. Jawaban dikumpulkan otomatis."
              : "Ujian berhasil dikumpulkan!",
            "success",
          );
          renderApp();
        } catch (err) {
          showToast("Gagal mengumpulkan ujian: " + err.message, "danger");
        }
      }

          const d = new Date(today);
          d.setDate(today.getDate() + i);
          const dateKey = toLocalDateKey(d);
          const hasExamsOnDay = state.exams.some((ex) => {
            const startKey = toLocalDateKey(ex.start_time);
            const endKey = toLocalDateKey(ex.end_time || ex.start_time);
            return dateKey >= startKey && dateKey <= endKey;
          });
          stripDays.push({
            dayName: daysOfWeek[d.getDay()],
            dateNum: d.getDate(),
            dateKey,
            hasExamsOnDay,
          });
        }

        const selectedDateObj = state.selectedCalendarDate
          ? new Date(state.selectedCalendarDate + "T00:00:00")
          : today;
        const monthName = selectedDateObj.toLocaleDateString("id-ID", {
          month: "long",
          year: "numeric",
        });
        const selectedDateLabel = selectedDateObj.toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "short",
        });

        const filteredExamsForDay = state.exams.filter((ex) => {
          const startKey = toLocalDateKey(ex.start_time);
          const endKey = toLocalDateKey(ex.end_time || ex.start_time);
          return (
            state.selectedCalendarDate >= startKey &&
            state.selectedCalendarDate <= endKey
          );
        });

        const isAdmin = state.user?.role === "admin";
        const photoUrl =
          !isAdmin && state.user?.photo_url ? state.user.photo_url : null;

        return `
        <aside class="w-full xl:w-80 shrink-0 flex flex-col gap-5">

                        <i data-lucide="id-card" class="w-3.5 h-3.5"></i> Kartu Ujian
                      </button>
                      <button type="button" onclick="window.toggleStudentStatus('${st.id}', ${!st.is_active})"
                        class="px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 text-xs font-semibold text-slate-600">
                        ${st.is_active ? "Nonaktifkan" : "Aktifkan"}

                      <button type="button" onclick="window.deleteRecord('students', '${st.id}')"

      function renderAdminQuestions() {
        const subjectsMap = {};
        state.question_folders.forEach((f) => {
          const subj = f.subject || "Umum";
          if (!subjectsMap[subj]) subjectsMap[subj] = [];
          subjectsMap[subj].push(f);
        });
        state.questions.forEach((q) => {
          const subj = q.subject || "Umum";
          if (!subjectsMap[subj]) subjectsMap[subj] = [];
        });
        const subjectNames = Object.keys(subjectsMap);

        // LEVEL 3: DAFTAR BUTIR SOAL DI DALAM FOLDER
        if (state.selectedSubject && state.selectedFolderId) {
          const activeFolder = state.question_folders.find(
            (f) => f.id === state.selectedFolderId,
          );
          const folderQuestions = state.questions.filter(
            (q) => q.folder_id === state.selectedFolderId,
          );

          return `
          <div class="bg-white rounded-2xl p-5 md:p-6 shadow-card border border-slate-200/70">
            <div class="flex flex-wrap items-center gap-2 text-xs font-semibold text-slate-500 mb-4 pb-3 border-b border-slate-100">
              <button type="button" onclick="window.navigateBankLevel(null, null)" class="hover:text-blue-600 flex items-center gap-1">
                <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Bank Soal (Mapel)
              </button>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300"></i>
              <button type="button" onclick="window.navigateBankLevel('${escapeHtml(state.selectedSubject)}', null)" class="hover:text-blue-600">
                ${escapeHtml(state.selectedSubject)}
              </button>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300"></i>
              <span class="text-blue-600 font-bold">${escapeHtml(activeFolder?.folder_name || "Folder Soal")}</span>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
              <div>
                <h2 class="text-xl font-display font-bold text-slate-900">${escapeHtml(activeFolder?.folder_name || "Daftar Soal")}</h2>
                <p class="text-sm text-slate-500 mt-0.5">${escapeHtml(activeFolder?.description || "Kumpulan soal dalam folder paket ujian ini.")}</p>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="window.openModal('question')"
                  class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="plus-circle" class="w-4 h-4"></i> Tambah Soal Pilihan Ganda
                </button>
              </div>
            </div>

            <div class="space-y-3">
              ${
                folderQuestions.length === 0
                  ? `
                <div class="text-center py-10 text-sm text-slate-400 border border-dashed border-slate-200 rounded-2xl">
                  Folder ini belum memiliki butir soal. Klik "Tambah Soal Pilihan Ganda" untuk mengisi soal.
                </div>
              `
                  : folderQuestions
                      .map(
                        (q, idx) => `
                <div class="p-4 rounded-xl border border-slate-200/80 bg-slate-50/40 flex items-start justify-between gap-4">
                  <div class="space-y-2 flex-1">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="px-2.5 py-0.5 rounded-md bg-blue-600 text-white text-xs font-bold">#${idx + 1}</span>
                      <span class="px-2.5 py-0.5 rounded-md bg-slate-200/70 text-slate-700 text-xs font-medium">${escapeHtml(q.difficulty)}</span>
                      <span class="text-xs font-bold text-emerald-600">${q.points} Poin</span>
                    </div>
                    <p class="text-sm font-medium text-slate-800 leading-relaxed">${escapeHtml(q.question_text)}</p>
                    ${
                      Array.isArray(q.options) && q.options.length > 0
                        ? `
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                        ${q.options
                          .map((opt) => {
                            const isKey = opt.key === q.correct_answer;
                            return `
                            <div class="px-3 py-2 rounded-lg text-xs border flex items-center gap-2 ${isKey ? "bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold" : "bg-white border-slate-200 text-slate-600"}">
                              <span class="w-5 h-5 rounded-md flex items-center justify-center font-bold shrink-0 ${isKey ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-700"}">${escapeHtml(opt.key)}</span>
                              <span class="truncate">${escapeHtml(opt.text)}</span>
                            </div>
                          `;
                          })
                          .join("")}
                      </div>
                    `
                        : ""
                    }
                  </div>
                  <button type="button" onclick="window.deleteRecord('questions', '${q.id}')"
                    class="p-2 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 shrink-0" title="Hapus Soal">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              `,
                      )
                      .join("")
              }
            </div>
          </div>
        `;
        }

        // LEVEL 2: DAFTAR FOLDER DI DALAM MATA PELAJARAN
        if (state.selectedSubject) {
          const foldersInSubject = subjectsMap[state.selectedSubject] || [];

          return `
          <div class="bg-white rounded-2xl p-5 md:p-6 shadow-card border border-slate-200/70">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 mb-4 pb-3 border-b border-slate-100">
              <button type="button" onclick="window.navigateBankLevel(null, null)" class="hover:text-blue-600 flex items-center gap-1">
                <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Bank Soal (Mapel)
              </button>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300"></i>
              <span class="text-blue-600 font-bold">${escapeHtml(state.selectedSubject)}</span>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
              <div>
                <h2 class="text-xl font-display font-bold text-slate-900">Folder Paket Soal — ${escapeHtml(state.selectedSubject)}</h2>
                <p class="text-sm text-slate-500 mt-0.5">Pilih folder soal untuk melihat butir soal, atau unggah PDF untuk menggenerate folder baru otomatis.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" onclick="window.openModal('pdf_import')"
                  class="px-4 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 rounded-xl text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="file-up" class="w-4 h-4"></i> Upload PDF -> Folder Baru
                </button>
                <button type="button" onclick="window.openModal('folder')"
                  class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="folder-plus" class="w-4 h-4"></i> Buat Folder Soal
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${
                foldersInSubject.length === 0
                  ? `
                <div class="md:col-span-2 text-center py-10 text-sm text-slate-400 border border-dashed border-slate-200 rounded-2xl">
                  Belum ada folder soal pada mata pelajaran ini. Silakan buat folder baru atau upload file PDF soal.
                </div>
              `
                  : foldersInSubject
                      .map((fld) => {
                        const qCount = state.questions.filter(
                          (q) => q.folder_id === fld.id,
                        ).length;
                        return `
                  <div class="p-5 rounded-2xl border border-slate-200/90 hover:border-blue-400 bg-slate-50/40 hover:bg-blue-50/20 transition-all flex flex-col justify-between gap-4">
                    <div class="flex items-start justify-between gap-3">
                      <div class="flex items-start gap-3">
                        <div class="w-11 h-11 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                          <i data-lucide="folder" class="w-6 h-6"></i>
                        </div>
                        <div>
                          <h3 class="font-display font-bold text-base text-slate-900 leading-snug">${escapeHtml(fld.folder_name)}</h3>
                          <p class="text-xs text-slate-500 mt-1 line-clamp-2">${escapeHtml(fld.description || "Kumpulan paket soal siap ujian.")}</p>
                        </div>
                      </div>
                      <button type="button" onclick="window.deleteRecord('question_folders', '${fld.id}')"
                        class="p-1.5 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50" title="Hapus Folder">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-200/70">
                      <span class="text-xs font-bold text-blue-600">${qCount} Butir Soal</span>
                      <button type="button" onclick="window.navigateBankLevel('${escapeHtml(state.selectedSubject)}', '${fld.id}')"
                        class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1.5">
                        Buka Folder <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                `;
                      })
                      .join("")
              }
            </div>
          </div>
        `;
        }

        // LEVEL 1: DAFTAR MATA PELAJARAN (ROOT BANK SOAL)
        return `
        <div class="bg-white rounded-2xl p-5 md:p-6 shadow-card border border-slate-200/70">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
            <div>
              <h2 class="text-xl font-display font-bold text-slate-900">Bank Soal Per Mata Pelajaran</h2>
              <p class="text-sm text-slate-500 mt-0.5">Kelola soal berdasarkan Mata Pelajaran & Folder Paket Soal, atau generate folder otomatis dari PDF.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="window.openModal('pdf_import')"
                class="px-4 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="file-up" class="w-4 h-4"></i> Upload Soal PDF -> Folder
              </button>
              <button type="button" onclick="window.openModal('folder')"
                class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="folder-plus" class="w-4 h-4"></i> Buat Folder Mapel
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${
              subjectNames.length === 0
                ? `
              <div class="md:col-span-3 text-center py-10 text-sm text-slate-400 border border-dashed border-slate-200 rounded-2xl">
                Bank soal masih kosong. Klik "Upload Soal PDF" atau "Buat Folder Mapel" untuk memulai.
              </div>
            `
                : subjectNames
                    .map((subj) => {
                      const folders = subjectsMap[subj] || [];
                      const totalQ = state.questions.filter(
                        (q) => q.subject === subj,
                      ).length;
                      return `
                <div onclick="window.navigateBankLevel('${escapeHtml(subj)}', null)"
                  class="cursor-pointer p-5 rounded-2xl border border-slate-200/90 hover:border-blue-500 bg-slate-50/40 hover:bg-blue-50/30 transition-all flex flex-col justify-between gap-4">
                  <div class="flex items-start gap-3.5">
                    <div class="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0">
                      <i data-lucide="book-marked" class="w-5 h-5"></i>
                    </div>
                    <div>
                      <span class="text-[11px] font-bold uppercase tracking-wider text-blue-600">Mata Pelajaran</span>
                      <h3 class="font-display font-bold text-base text-slate-900 mt-0.5 leading-snug">${escapeHtml(subj)}</h3>
                    </div>
                  </div>
                  <div class="flex items-center justify-between pt-3 border-t border-slate-200/70 text-xs">
                    <span class="font-semibold text-slate-600">${folders.length} Folder • ${totalQ} Soal</span>
                    <span class="font-bold text-blue-600 flex items-center gap-1">Lihat Folder <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
                  </div>
                </div>
              `;
                    })
                    .join("")
            }
          </div>
        </div>
      `;
      }

      function renderAdminExams() {
        return `
        <div class="bg-white rounded-2xl p-5 md:p-6 shadow-card border border-slate-200/70">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
            <div>
              <h2 class="text-xl font-display font-bold text-slate-900">Paket Ujian & Token Masuk</h2>
              <p class="text-sm text-slate-500 mt-0.5">Tautkan folder soal ke paket ujian dan bagikan Token 6-Digit kepada peserta.</p>
            </div>
            <button type="button" onclick="window.openModal('exam')"
              class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 self-start">
              <i data-lucide="plus-circle" class="w-4 h-4"></i> Buat Paket Ujian
            </button>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${
              state.exams.length === 0
                ? `
              <div class="md:col-span-2 text-center py-8 text-sm text-slate-400">Belum ada paket ujian yang dibuat.</div>
            `
                : state.exams
                    .map((ex) => {
                      const linkedFolder = state.question_folders.find(

                      const qCount = ex.folder_id
                        ? state.questions.filter(
                            (q) => q.folder_id === ex.folder_id,

                        : state.exam_questions.filter(
                            (eq) => eq.exam_id === ex.id,

                      return `
                <div class="p-5 rounded-2xl border border-slate-200/80 hover:border-blue-300 transition-all flex flex-col justify-between gap-4">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-2.5">
                      <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${ex.status === "Active" ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-600"}">

                      <div class="flex items-center gap-1.5 bg-amber-50 border border-amber-200 px-3 py-1 rounded-lg">
                        <span class="text-[11px] font-bold text-amber-800 uppercase">Token:</span>
                        <span class="text-xs font-extrabold tracking-widest text-amber-900">${escapeHtml(ex.exam_token || "CBT26A")}</span>
                        <button type="button" onclick="window.regenerateExamToken('${ex.id}')" title="Acak Token Baru" class="text-amber-700 hover:text-amber-950 ml-1">
                          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                    <h3 class="font-display font-bold text-base text-slate-900">${escapeHtml(ex.title)}</h3>
                    <p class="text-xs text-slate-500 mt-1">${escapeHtml(ex.subject)} • Target: <b>${escapeHtml(ex.target_class)}</b></p>
                    <p class="text-xs text-blue-600 font-medium mt-1.5 flex items-center gap-1.5">
                      <i data-lucide="folder" class="w-3.5 h-3.5"></i>
                      <span>${linkedFolder ? escapeHtml(linkedFolder.folder_name) : "Folder Manual"} (${qCount} Soal)</span>
                    </p>
                    <div class="flex items-center gap-4 mt-3 text-xs text-slate-600">
                      <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5 text-blue-600"></i> ${ex.duration_minutes} Menit</span>
                      <span class="flex items-center gap-1"><i data-lucide="award" class="w-3.5 h-3.5 text-emerald-600"></i> KKM ${ex.passing_score}</span>
                    </div>
                  </div>
                  <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">

                      class="px-3.5 py-2 rounded-xl text-xs font-bold ${ex.status === "Active" ? "bg-amber-50 text-amber-700" : "bg-emerald-600 text-white"}">
                      ${ex.status === "Active" ? "Nonaktifkan" : "Aktifkan Ujian"}
                    </button>
                    <button type="button" onclick="window.deleteRecord('exams', '${ex.id}')"
                      class="px-3 py-2 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 text-xs font-semibold">
                      Hapus
                    </button>
                  </div>
                </div>
              `;
                    })
                    .join("")
            }
          </div>
        </div>
      `;
      }

      function renderAdminResults() {
        const completed = state.exam_sessions.filter(
          (s) => s.status !== "In Progress",
        );
        return `
        <div id="printable-report" class="bg-white rounded-2xl p-5 md:p-6 shadow-card border border-slate-200/70">

            <div>
              <h2 class="text-xl font-display font-bold text-slate-900">Rekapitulasi Nilai & Laporan Evaluasi</h2>
              <p class="text-sm text-slate-500 mt-0.5">Nilai otomatis terhitung berdasarkan bobot soal serta status kelulusan KKM.</p>
            </div>
            <button type="button" onclick="window.print()"
              class="px-4 py-2.5 bg-[#14243A] hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 self-start">
              <i data-lucide="printer" class="w-4 h-4"></i> Cetak / Simpan PDF

                  completed.length === 0

                          return `
                    <tr>
                      <td class="py-3.5 px-3 font-bold text-slate-900">${escapeHtml(st?.full_name || "Siswa")} <span class="block text-xs font-normal text-slate-400">NIS: ${escapeHtml(st?.nis || "-")}</span></td>
                      <td class="py-3.5 px-3 text-xs text-slate-700">${escapeHtml(ex?.title || "-")}</td>

        const currentAns = answersMap[currentQ.id] || {
          selected_answer: null,

          Boolean(answersMap[q.id]?.selected_answer),

                    <div class="space-y-3">
                      ${currentQ.displayOptions
                        .map((opt, idx) => {
                          const letter = String.fromCharCode(65 + idx);
                          const isSelected =
                            currentAns.selected_answer === opt.key;
                          return `
                          <button type="button" onclick="window.saveStudentAnswer('${currentQ.id}', '${escapeHtml(opt.key)}')"
                            class="w-full text-left p-4 rounded-2xl border transition-all flex items-start gap-3.5 ${isSelected ? "bg-blue-50/80 border-blue-600 ring-2 ring-blue-600/15" : "bg-white border-slate-200 hover:border-blue-300"}">
                            <span class="w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold shrink-0 ${isSelected ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-700"}">
                              ${letter}
                            </span>
                            <span class="text-base text-slate-800 pt-0.5 leading-relaxed">${escapeHtml(opt.text)}</span>
                          </button>
                        `;
                        })
                        .join("")}
                    </div>
                  `
                  }
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3 pt-6 mt-6 border-t border-slate-100">
                  <button type="button" onclick="window.gotoQuestion(${currentIndex - 1})" ${currentIndex === 0 ? "disabled" : ""}

                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Sebelumnya
                  </button>

                  <button type="button" onclick="window.saveStudentAnswer('${currentQ.id}', undefined, true)"
                    class="px-4 py-3 rounded-xl text-sm font-bold flex items-center gap-1.5 transition-colors ${currentAns.is_doubtful ? "bg-amber-500 text-white" : "bg-amber-50 text-amber-700 border border-amber-200"}">
                    <i data-lucide="flag" class="w-4 h-4"></i> ${currentAns.is_doubtful ? "Ditandai Ragu-Ragu" : "Tandai Ragu-Ragu"}
                  </button>

                  ${
                    currentIndex < questions.length - 1
                      ? `
                    <button type="button" onclick="window.gotoQuestion(${currentIndex + 1})"
                      class="px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold flex items-center gap-1.5">
                      Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                  `
                      : `
                    <button type="button" onclick="window.confirmSubmitExam()"
                      class="px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold flex items-center gap-1.5">

                    </button>
                  `
                  }

              </div>

              <div class="lg:col-span-4 flex flex-col gap-4">

                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-600">Navigasi Nomor Soal</h3>
                    <span class="text-xs font-bold text-blue-600">${answeredCount}/${questions.length} Dijawab</span>
                  </div>

                  <div class="grid grid-cols-5 gap-2 mb-4">
                    ${questions
                      .map((q, idx) => {
                        const a = answersMap[q.id];
                        const hasAns = Boolean(a?.selected_answer);
                        const isDoubt = Boolean(a?.is_doubtful);
                        let badgeClass =
                          "bg-slate-100 text-slate-600 border-slate-200";
                        if (hasAns && isDoubt)
                          badgeClass =
                            "bg-emerald-600 text-white border-emerald-600";
                        else if (isDoubt)
                          badgeClass =
                            "bg-amber-400 text-slate-900 border-amber-400";
                        else if (hasAns)
                          badgeClass = "bg-blue-600 text-white border-blue-600";

                        const activeRing =
                          idx === currentIndex
                            ? "ring-2 ring-offset-2 ring-slate-900"
                            : "";
                        return `
                        <button type="button" onclick="window.gotoQuestion(${idx})"
                          class="h-11 rounded-xl border text-sm font-bold transition-all ${badgeClass} ${activeRing}">
                          ${idx + 1}
                        </button>
                      `;
                      })
                      .join("")}
                  </div>

                  <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-100 text-xs text-slate-600">
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-200"></span> Belum dijawab</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-blue-600"></span> Sudah dijawab</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-400"></span> Ragu-ragu</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-600"></span> Dijawab & ditinjau</span>
                  </div>
                </div>

                <button type="button" onclick="window.confirmSubmitExam()"
                  class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-sm font-bold shadow-sm transition-colors flex items-center justify-center gap-2">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i> Selesai & Kumpulkan Ujian
                </button>
              </div>
            </div>
          </div>

          ${
            warningModal
              ? `
            <div class="fixed inset-0 z-[1000005] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
              <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl p-6 border-2 border-red-200 shadow-2xl">
                <div class="w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center mb-4">
                  <i data-lucide="shield-alert" class="w-6 h-6"></i>
                </div>
                <span class="px-2.5 py-1 rounded-md bg-red-50 text-red-600 text-xs font-bold uppercase">
                  Peringatan Keamanan #${warningModal.count} (${escapeHtml(warningModal.type)})
                </span>
                <h3 class="font-display font-bold text-lg text-slate-900 mt-2">Aktivitas Terlarang Terdeteksi</h3>
                <p class="text-sm text-slate-600 mt-2 leading-relaxed">${escapeHtml(warningModal.message)}</p>
                <p class="text-xs text-slate-400 mt-2">Jawaban Anda tetap aman tersimpan. Akumulasi poin pelanggaran: <b>${warningModal.totalPoints} poin</b>.</p>
                <button type="button" onclick="window.dismissWarningModal()"
                  class="w-full mt-5 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold">
                  Saya Mengerti & Kembali ke Ujian
                </button>
              </div>
            </div>
          `
              : ""
          }
        </div>
      `;
      }

          return `
          <div class="fixed inset-0 z-[1000003] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="max-w-lg w-full bg-white rounded-3xl p-6 shadow-2xl border border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-display font-bold text-lg text-slate-900">Riwayat Aktivitas & Pelanggaran Sesi</h3>
                <button type="button" onclick="window.closeModal()" class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>
              <div class="space-y-2.5 max-h-72 overflow-y-auto">
                ${
                  logs.length === 0
                    ? `<p class="text-sm text-slate-400 text-center py-6">Tidak ada pelanggaran tercatat pada sesi ini.</p>`
                    : logs
                        .map(
                          (l) => `
                  <div class="p-3.5 rounded-xl bg-red-50/60 border border-red-100 text-xs">
                    <div class="flex justify-between font-bold text-red-700">
                      <span>${escapeHtml(l.violation_type)} (+${l.points} Poin)</span>
                      <span>${formatTimeOnly(l.created_at)}</span>
                    </div>
                    <p class="text-slate-600 mt-1">${escapeHtml(l.description)}</p>
                  </div>
                `,
                        )
                        .join("")
                }
              </div>
            </div>
          </div>
        `;
        }
        return "";
      }

      // =========================================================================
      // 11. EVENT HANDLERS GLOBAL & INISIALISASI
      // =========================================================================
      window.switchLoginRole = (role) => {
        const btnStd = document.getElementById("btn-tab-student");
        const btnAdm = document.getElementById("btn-tab-admin");
        const formStd = document.getElementById("form-login-student");
        const formAdm = document.getElementById("form-login-admin");
        if (role === "student") {
          btnStd.className =
            "py-2.5 px-4 rounded-lg text-sm font-semibold transition-all bg-white text-blue-600 shadow-sm flex items-center justify-center gap-2";
          btnAdm.className =
            "py-2.5 px-4 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
          formStd.classList.remove("hidden");
          formAdm.classList.add("hidden");
        } else {
          btnAdm.className =
            "py-2.5 px-4 rounded-lg text-sm font-semibold transition-all bg-white text-blue-600 shadow-sm flex items-center justify-center gap-2";
          btnStd.className =
            "py-2.5 px-4 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
          formAdm.classList.remove("hidden");
          formStd.classList.add("hidden");
        }
      };

      window.submitStudentLoginForm = () => {
        const u = document.getElementById("std-username").value.trim();
        const p = document.getElementById("std-password").value;
        loginStudent(u, p);
      };

      window.submitAdminLoginForm = () => {
        const e = document.getElementById("adm-email").value.trim();
        const p = document.getElementById("adm-password").value;
        loginAdmin(e, p);
      };

      window.quickLogin = (role) => {
        if (role === "admin") loginAdmin("admin@sekolah.sch.id", "admin123");
        else loginStudent("nadia.putri", "password123");
      };

      window.logoutUser = logoutUser;
      window.setAdminTab = (tab) => {
        state.activeTab = tab;
        renderApp();
      };
      window.setStudentTab = (tab) => {
        state.studentTab = tab;
        renderApp();
      };
      window.navigateBankLevel = (subject, folderId) => {
        state.selectedSubject = subject;
        state.selectedFolderId = folderId;
        renderApp();
      };
      window.selectCalendarDate = (dateKey) => {
        state.selectedCalendarDate = dateKey;
        renderApp();
      };
      window.updateSearchQuery = (q) => {
        state.searchQuery = q;
        renderApp();
      };
      window.updateFilterClass = (c) => {
        state.filterClass = c;
        renderApp();
      };
      window.refreshData = async () => {
        await loadAllData();
        showToast("Data diperbarui.", "info");
        renderApp();
      };
      window.openModal = (type) => {
        if (type === "pdf_import") state.pdfImportPreview = null;
        state.modal = { type };
        renderApp();
      };
      window.closeModal = () => {
        state.modal = null;
        renderApp();
      };

      window.previewStudentExamCard = (studentId) => {
        state.modal = { type: "student_card_preview", studentId };
        renderApp();
      };

      window.uploadStudentPhoto = (inputEl) => {
        const file = inputEl.files?.[0];
        if (!file || !state.user) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          const dataUrl = e.target.result;
          try {
            await dbUpdate("students", state.user.id, { photo_url: dataUrl });
            state.user.photo_url = dataUrl;
            showToast("Pas foto Kartu Ujian berhasil diperbarui!", "success");
            renderApp();
          } catch (err) {
            showToast("Gagal menyimpan foto: " + err.message, "danger");
          }
        };
        reader.readAsDataURL(file);
      };

      window.submitFolderForm = async () => {
        const subject = document.getElementById("fld-subject").value.trim();
        const folder_name = document.getElementById("fld-name").value.trim();
        const description = document.getElementById("fld-desc").value.trim();
        try {
          const created = await dbInsert("question_folders", {
            subject,
            folder_name,
            description,
          });
          state.modal = null;
          state.selectedSubject = subject;
          state.selectedFolderId = created.id;
          showToast("Folder paket soal berhasil dibuat.", "success");
          renderApp();
        } catch (err) {
          showToast(err.message, "danger");
        }
      };

      window.submitStudentForm = async () => {
        const photoFile = document.getElementById("f-photo")?.files?.[0];
        const saveRecord = async (photoDataUrl) => {
          try {
            await dbInsert("students", {
              nis: document.getElementById("f-nis").value.trim(),
              full_name: document.getElementById("f-name").value.trim(),
              class_name: document.getElementById("f-class").value.trim(),
              room_name:
                document.getElementById("f-room").value.trim() ||
                "Lab Komputer 01",
              seat_number:
                document.getElementById("f-seat").value.trim() || "PC-01",
              username: document.getElementById("f-user").value.trim(),
              password: document.getElementById("f-pass").value,
              photo_url: photoDataUrl || "",
              is_active: true,
            });
            state.modal = null;
            showToast("Siswa baru berhasil ditambahkan.", "success");
            renderApp();
          } catch (err) {
            showToast(err.message, "danger");
          }
        };

        if (photoFile) {
          const reader = new FileReader();
          reader.onload = (e) => saveRecord(e.target.result);
          reader.readAsDataURL(photoFile);
        } else {
          saveRecord("");
        }
      };

      window.toggleStudentStatus = async (id, is_active) => {
        await dbUpdate("students", id, { is_active });
        showToast("Status akun siswa diperbarui.", "info");
        renderApp();
      };

      window.submitQuestionForm = async () => {
        const options = [];
        ["A", "B", "C", "D", "E"].forEach((letter) => {
          const val = document.getElementById(`q-opt-${letter}`)?.value.trim();
          if (val) options.push({ key: letter, text: val });
        });
        const selectedRadio = document.querySelector(
          'input[name="q-correct-radio"]:checked',
        );
        const correct_answer = selectedRadio ? selectedRadio.value : "A";
        const subject = document.getElementById("q-subject").value.trim();

        try {
          await dbInsert("questions", {
            folder_id: state.selectedFolderId || null,
            subject,
            category: "Pilihan Ganda",
            difficulty: document.getElementById("q-diff").value,
            question_type: "multiple_choice",
            question_text: document.getElementById("q-text").value.trim(),
            image_url: document.getElementById("q-image").value.trim(),
            options,
            correct_answer,
            points: Number(document.getElementById("q-points").value || 10),
          });
          state.modal = null;
          showToast(
            "Soal pilihan ganda berhasil disimpan ke folder.",
            "success",
          );
          renderApp();
        } catch (err) {
          showToast(err.message, "danger");
        }
      };

      window.submitExamForm = async () => {
        try {
          const folderId = document.getElementById("e-folder").value;
          const folderObj = state.question_folders.find(
            (f) => f.id === folderId,
          );
          if (!folderObj) {
            showToast("Pilih folder soal terlebih dahulu.", "warning");
            return;
          }
          const token = (
            document.getElementById("e-token").value.trim() ||
            generateExamToken()
          ).toUpperCase();
          const exam = await dbInsert("exams", {
            title: document.getElementById("e-title").value.trim(),
            subject: folderObj.subject,
            folder_id: folderId,
            exam_token: token,
            target_class: document.getElementById("e-class").value.trim(),
            duration_minutes: Number(
              document.getElementById("e-duration").value || 60,
            ),
            passing_score: Number(document.getElementById("e-kkm").value || 75),
            description: document.getElementById("e-desc").value.trim(),
            start_time: new Date().toISOString(),
            end_time: new Date(Date.now() + 86400 * 1000).toISOString(),
            shuffle_questions: true,
            shuffle_options: true,
            status: "Active",
            is_published: true,
          });
          const folderQuestions = state.questions.filter(
            (q) => q.folder_id === folderId,
          );
          for (let i = 0; i < folderQuestions.length; i++) {
            await dbInsert("exam_questions", {
              exam_id: exam.id,
              question_id: folderQuestions[i].id,
              order_num: i + 1,
            });
          }
          state.modal = null;
          showToast(
            `Paket ujian diterbitkan dengan Token: ${token}`,
            "success",
          );
          renderApp();
        } catch (err) {
          showToast(err.message, "danger");
        }
      };

      window.regenerateExamToken = async (examId) => {
        const newToken = generateExamToken();
        await dbUpdate("exams", examId, { exam_token: newToken });
        showToast(`Token ujian diperbarui menjadi: ${newToken}`, "success");
        renderApp();
      };

      window.toggleExamStatus = async (id, status) => {
        await dbUpdate("exams", id, { status });
        showToast(`Status ujian diubah menjadi ${status}.`, "info");
        renderApp();
      };

      window.deleteRecord = async (table, id) => {
        await dbDelete(table, id);
        showToast("Data berhasil dihapus.", "info");
        renderApp();
      };

      window.inspectSessionViolations = (sessionId) => {
        state.modal = { type: "violations", sessionId };
        renderApp();
      };

      window.adminForceSubmit = async (sessionId) => {
        await dbUpdate("exam_sessions", sessionId, {
          status: "Force Submitted",
          submitted_at: new Date().toISOString(),
        });
        showToast(
          "Sesi peserta telah dihentikan paksa (Force Submit).",
          "warning",
        );
        renderApp();
      };

      window.openExamPreflight = openExamPreflight;
      window.runDeviceDiagnostic = runDeviceDiagnostic;
      window.startExamSession = startExamSession;
      window.togglePreflightRules = (checked) => {
        state.preflight.rulesAccepted = checked;
        renderApp();
      };
      window.cancelPreflight = () => {
        state.preflight.exam = null;
        renderApp();
      };
      window.gotoQuestion = (idx) => {
        if (idx >= 0 && idx < state.activeExam.questions.length) {
          state.activeExam.currentIndex = idx;
          renderApp();
        }
      };
      window.saveStudentAnswer = saveStudentAnswer;
      window.confirmSubmitExam = () => {
        if (
          confirm(
            "Apakah Anda yakin ingin mengumpulkan ujian sekarang? Jawaban tidak dapat diubah setelah dikumpulkan.",
          )
        ) {
          submitExamSession(false);
        }
      };
      window.dismissWarningModal = async () => {
        state.activeExam.warningModal = null;
        if (
          !document.fullscreenElement &&
          document.documentElement.requestFullscreen
        ) {
          await document.documentElement.requestFullscreen().catch(() => {});
        }
        renderApp();
      };

      // =========================================================================
      // 12. RENDER ENGINE UTAMA & BOOTSTRAP SESSION
      // =========================================================================
      function renderApp() {
        const root = document.getElementById("securecbt-root");
        let screenHtml = "";

        if (!state.user) {
          screenHtml = renderLoginView();
        } else if (state.activeExam.session) {
          screenHtml = renderExamWorkspace();
        } else if (state.preflight.exam) {
          screenHtml = renderPreflightView();
        } else if (state.user.role === "admin") {
          screenHtml = renderAdminDashboardLayout();
        } else {
          screenHtml = renderStudentDashboardLayout();
        }

        root.innerHTML = screenHtml + renderAdminModal() + renderToasts();
        if (window.lucide) window.lucide.createIcons();
      }

      (async function bootstrap() {
        if (!IS_PREVIEW && supabase) {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (session?.user) {
            state.user = {
              id: session.user.id,
              role: "admin",
              name: "Administrator CBT",
              email: session.user.email,
            };
            await loadAllData();
          } else {
            const savedStudent = sessionStorage.getItem("securecbt_student");
            if (savedStudent) {
              state.user = JSON.parse(savedStudent);
              await loadAllData();
            }
          }
        }
        renderApp();
      })();
    </script>
  </body>
</html>
